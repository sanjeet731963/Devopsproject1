version: '3.8'

services:
  frontend:
    image: sanjeetmandal/first:frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - agro-network

  backend:
    image: sanjeetmandal/first:backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/agroai
    depends_on:
      - mongo
    networks:
      - agro-network
    volumes:
      - backend-uploads:/app/uploads

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - agro-network

networks:
  agro-network:
    driver: bridge

volumes:
  mongo-data:
  backend-uploads: